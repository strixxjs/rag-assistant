name: RAG Eval Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# ---------------------------------------------------------------------------
# NOTE: This gate runs against a SMALL CI FIXTURE (~300 chunks), NOT the full
# rag_eval corpus (20k+ chunks). The fixture is fast (~60s total) and keeps
# CI deterministic. The threshold in eval/config.json is calibrated against
# the fixture, not the production corpus. Full-corpus eval is run locally.
# ---------------------------------------------------------------------------

jobs:
  eval:
    name: "Hit-rate gate (fixture corpus)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      qdrant:
        image: qdrant/qdrant:v1.13.6
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -sf http://localhost:6333/ || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU-only torch
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu --quiet

      - name: Install project dependencies
        run: |
          pip install \
            sentence-transformers \
            qdrant-client \
            langchain-text-splitters \
            httpx \
            numpy \
            --quiet

      - name: Build CI fixture corpus
        run: |
          python eval/ci_fixture.py
        env:
          QDRANT_URL: http://localhost:6333

      - name: Run hit-rate evaluation
        id: hitrate
        run: |
          python eval/run_hitrate.py
          echo "result_path=eval/results/baseline_hitrate.json" >> "$GITHUB_OUTPUT"
        env:
          QDRANT_URL: http://localhost:6333

      - name: Check threshold gate
        run: |
          python - <<'EOF'
          import json, sys
          from pathlib import Path

          cfg = json.loads(Path("eval/config.json").read_text())
          threshold = cfg["ci_hitrate3_threshold"]

          result = json.loads(Path("eval/results/baseline_hitrate.json").read_text())
          actual = result["hit_rate@3"]

          print(f"hit-rate@3 : {actual:.4f}")
          print(f"threshold  : {threshold:.4f}")

          if actual < threshold:
              print(f"❌ FAIL — hit-rate@3 {actual:.4f} < threshold {threshold:.4f}")
              sys.exit(1)
          else:
              print(f"✅ PASS — hit-rate@3 {actual:.4f} >= threshold {threshold:.4f}")
          EOF

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results/
